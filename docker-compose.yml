services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moneymaker
      POSTGRES_PASSWORD: moneymaker
      POSTGRES_DB: moneymaker
    ports:
      - "5432:5432"
    volumes:
      # Applied in filename order on first boot of an empty volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneymaker -d moneymaker"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      MM_DATABASE_URL: postgresql+psycopg://moneymaker:moneymaker@db:5432/moneymaker
      MM_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
